[package]
name = "fygram"
version = "0.6.0"
description = "your telegram channels, as a music library"
authors = ["amoyrlet <amoyrlet@proton.me>"]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/amoyrlet-tg/fygram"

[lib]
name = "fygram_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

futures-util = "0.3"

tokio = { version = "1", features = ["full"] }

tokio-util = { version = "0.7.18", features = ["rt"] }

sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "chrono", "uuid", "migrate"] }

grammers-client = { git = "https://codeberg.org/Lonami/grammers", branch = "master" }
grammers-session = { git = "https://codeberg.org/Lonami/grammers", branch = "master", default-features = false, features = ["serde"] }
grammers-mtsender = { git = "https://codeberg.org/Lonami/grammers", branch = "master" }

lofty = "0.22"
# only to look at a cover's colours; the webview cannot read pixels from the
# asset protocol without tainting its canvas
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
# rodio is the output path only - decoding goes through ffmpeg, so none of its
# own decoders are compiled in
rodio = { version = "0.20", default-features = false }
ffmpeg-next = { version = "8.1", default-features = false, features = [
    "codec",
    "format",
    "software-resampling",
    "static",
] }

uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"

regex = "1"

base64 = "0.22"

reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "query"] }
flate2 = "1"
tauri-plugin-dialog = "2"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

# Cargo has no idea what "desktop" means, so the condition is spelled out.
# Autostart, the single-instance guard and the lock file it uses are all notions
# that only exist where there is a desktop session to start into.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
fd-lock = "4.0.4"
dirs = "6.0.0"

# Only reached from JNI_OnLoad - see src/android.rs.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Threading",
] }

[profile.dev]
debug-assertions = false
overflow-checks = true

[profile.dev.package."*"]
debug-assertions = false

# See STYLE.md §13: these are not a matter of taste, and CI runs them with
# -D warnings.
[lints.rust]
rust_2018_idioms = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[lints.clippy]
all = "warn"
