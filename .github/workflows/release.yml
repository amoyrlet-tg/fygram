name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

env:
  # grammers comes from git, and cargo's built-in fetcher hands back
  # "SSL error: unknown error; class=Ssl (16)" often enough to fail a whole
  # matrix at once. The git binary does not.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_NET_RETRY: "5"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            rust_target: ""
            ff_arch: native
            args: "--bundles deb,appimage"
          - os: windows-latest
            rust_target: ""
            ff_arch: msvc
            args: "--bundles msi,nsis"
          - os: windows-latest
            rust_target: "i686-pc-windows-msvc"
            ff_arch: msvc-x86
            args: "--target i686-pc-windows-msvc --bundles msi,nsis"
          - os: macos-14
            rust_target: "aarch64-apple-darwin,x86_64-apple-darwin"
            ff_arch: universal
            args: "--target universal-apple-darwin --bundles dmg,app"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            build-essential \
            file \
            libasound2-dev

      # fygram decodes through ffmpeg, built here for audio only - a few
      # megabytes instead of the twenty a full build costs. Cached per platform:
      # rebuilding it on every run would add five minutes for nothing.
      - name: Cache ffmpeg
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ffmpeg-prefix
          # rust_target carries a comma on macos and cache keys may not contain one
          key: ffmpeg-audio-7.1.1-${{ matrix.os }}-${{ matrix.ff_arch }}-${{ hashFiles('packaging/ffmpeg/build-audio.sh') }}

      - name: Install ffmpeg build tools (linux)
        if: matrix.os == 'ubuntu-22.04' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: sudo apt-get install -y nasm

      - name: Install ffmpeg build tools (macos)
        if: matrix.os == 'macos-14' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: brew install nasm

      - name: Build ffmpeg (unix)
        if: matrix.os != 'windows-latest' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: packaging/ffmpeg/build-audio.sh "$PWD/ffmpeg-prefix" "${{ matrix.ff_arch }}"

      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.os == 'windows-latest'
        with:
          arch: ${{ matrix.rust_target == 'i686-pc-windows-msvc' && 'x86' || 'x64' }}

      - uses: msys2/setup-msys2@v2
        if: matrix.os == 'windows-latest' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        with:
          msystem: MINGW64
          path-type: inherit
          install: make nasm diffutils pkgconf

      - name: Build ffmpeg (windows)
        if: matrix.os == 'windows-latest' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: packaging/ffmpeg/build-audio.sh "$(pwd)/ffmpeg-prefix" "${{ matrix.ff_arch }}"

      # cl.exe cannot read the /d/a/... form a bash shell reports on windows,
      # so the path goes over in its native shape
      - name: Point the build at ffmpeg (windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: echo "FFMPEG_DIR=${{ github.workspace }}\ffmpeg-prefix" >> $env:GITHUB_ENV

      - name: Point the build at ffmpeg (unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: echo "FFMPEG_DIR=$PWD/ffmpeg-prefix" >> "$GITHUB_ENV"

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: fygram ${{ github.ref_name }}
          releaseDraft: true
          releaseBody: "Automated build."
          args: ${{ matrix.args }}

  # Android is built one ABI at a time: the ffmpeg prefix is per-architecture,
  # and one FFMPEG_DIR cannot serve two of them.
  android:
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64
            tauri_target: aarch64
            rust_target: aarch64-linux-android
            ff_arch: android-arm64
            cc_triple: aarch64-linux-android
          - abi: x86_64
            tauri_target: x86_64
            rust_target: x86_64-linux-android
            ff_arch: android-x86_64
            cc_triple: x86_64-linux-android
    runs-on: ubuntu-22.04
    env:
      NDK_VERSION: 27.1.12297006
      # matches minSdk in gen/android/app/build.gradle.kts; the linker will
      # happily bind symbols the device does not have if these disagree
      ANDROID_API: 26
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: "ndk;${{ env.NDK_VERSION }}"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android-${{ matrix.abi }}

      - name: Cache ffmpeg
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ffmpeg-prefix
          key: ffmpeg-audio-7.1.1-${{ matrix.ff_arch }}-${{ hashFiles('packaging/ffmpeg/build-audio.sh') }}

      - name: Install ffmpeg build tools
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y nasm

      - name: Point the build at the NDK
        run: |
          ndk="$ANDROID_SDK_ROOT/ndk/$NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ndk" >> "$GITHUB_ENV"

      - name: Build ffmpeg (audio only)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: packaging/ffmpeg/build-audio.sh "$PWD/ffmpeg-prefix" "${{ matrix.ff_arch }}"

      # The `cc` crate looks for "<triple>-clang", but the NDK only ships the
      # name with an api level in it. Without these, anything with C in it -
      # aws-lc-sys behind reqwest's tls - fails to configure.
      - name: Point the build at the toolchain
        run: |
          tc="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          triple="${{ matrix.cc_triple }}"
          {
            echo "FFMPEG_DIR=$PWD/ffmpeg-prefix"
            echo "CC_${triple//-/_}=$tc/$triple$ANDROID_API-clang"
            echo "CXX_${triple//-/_}=$tc/$triple$ANDROID_API-clang++"
            echo "AR_${triple//-/_}=$tc/llvm-ar"
            echo "CARGO_TARGET_$(echo "${triple//-/_}" | tr '[:lower:]' '[:upper:]')_LINKER=$tc/$triple$ANDROID_API-clang"
            # ffmpeg-sys-next generates its bindings with bindgen, which reads
            # the host's headers unless it is told where the target's are. It
            # then fails on a Debian multiarch layout, and - worse - quietly
            # succeeds on a distribution whose headers happen to sit where it
            # looked, producing bindings for the wrong libc.
            echo "BINDGEN_EXTRA_CLANG_ARGS=--sysroot=$(dirname "$tc")/sysroot --target=$triple$ANDROID_API"
          } >> "$GITHUB_ENV"

      - run: npm ci

      # gen/android carries the hand-written half - MainActivity, the media
      # notification, the icons - but everything tauri regenerates is ignored,
      # so it has to be put back before gradle sees the project.
      - name: Restore the generated half of the android project
        run: npx tauri android init --skip-targets-install

      # Debug rather than release: signing needs a keystore, and an unsigned
      # release APK cannot be installed at all.
      - name: Build the APK
        run: npx tauri android build --debug --target ${{ matrix.tauri_target }}

      - name: Collect the APK
        run: |
          mkdir -p out
          find src-tauri/gen/android/app/build/outputs -name '*.apk' -print0 |
            while IFS= read -r -d "" f; do
              cp "$f" "out/fygram-${{ matrix.abi }}-debug.apk"
            done
          ls -la out

      - name: Upload the APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: fygram-android-${{ matrix.abi }}
          path: out/*.apk

      - name: Attach the APK to the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: out/*.apk

  arch:
    needs: build
    runs-on: ubuntu-latest
    container: archlinux:latest
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            git base-devel rust nodejs npm \
            webkit2gtk-4.1 gtk3 libappindicator-gtk3 librsvg \
            openssl alsa-lib \
            curl wget file desktop-file-utils xdg-utils shared-mime-info \
            nasm clang

      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build ffmpeg (audio only)
        run: |
          packaging/ffmpeg/build-audio.sh "$PWD/ffmpeg-prefix" native
          echo "FFMPEG_DIR=$PWD/ffmpeg-prefix" >> "$GITHUB_ENV"

      - run: npm ci

      - name: Build binary (Arch native)
        run: npm run tauri build -- --no-bundle

      - name: Bundle AppImage (best-effort)
        continue-on-error: true
        run: npm run tauri build -- --bundles appimage

      - name: Collect Arch artifacts
        run: |
          mkdir -p out
          cp src-tauri/target/release/fygram out/fygram-arch-x86_64
          stage="fygram-arch"
          mkdir -p "$stage"
          cp src-tauri/target/release/fygram "$stage/fygram-arch-x86_64"
          cp install.sh "$stage/install.sh"
          chmod +x "$stage/install.sh"
          cp src-tauri/icons/128x128.png "$stage/fygram.png"
          tar -czf out/fygram-arch-installer.tar.gz "$stage"
          for f in src-tauri/target/release/bundle/appimage/*.AppImage; do
            [ -e "$f" ] || continue
            base="$(basename "$f" .AppImage)"
            cp "$f" "out/${base}-arch.AppImage"
          done
          ls -la out

      - name: Attach Arch build to the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: out/*

      - name: Upload Arch build as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fygram-arch
          path: out/*
